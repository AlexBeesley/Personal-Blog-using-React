[build]
    command = "npm run build"
    publish = "build"

[build.environment]
    NODE_VERSION = "22"

# Single-page app: every route is served the shell and React Router takes over.
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

# Order matters: where paths overlap the LAST matching rule wins, so the broad
# default goes first and the specific rules after it.
[[headers]]
    for = "/*"
    [headers.values]
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Vite fingerprints everything under /assets, so it can be cached for good.
[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"
